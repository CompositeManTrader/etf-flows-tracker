name: Daily ETF Snapshot

on:
  schedule:
    - cron: '30 23 * * 1-5'  # evening: issuers have struck NAV/shares for the session
    - cron: '0 12 * * 2-6'   # next morning: catches late publishers and fills any missed run
  workflow_dispatch:

concurrency:
  group: daily-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: python jobs/daily_snapshot.py
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/shares/
          git diff --quiet --cached && exit 0
          git commit -m "chore: shares snapshot $(date -u +%F_%H%M)"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1
